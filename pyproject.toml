[project]
name = "paper-deep-dive"
version = "0.1.0"
description = "Curated learning materials and minimal reproductions for foundational ML papers."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "torch",
    "torchvision",
    "scikit-learn",
    "matplotlib",
    "PyYAML",
]

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["tests"]
